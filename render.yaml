databases:
  - name: aryan-cloud-db
    plan: basic-256mb
    databaseName: aryancloud
    user: aryancloud

services:
  - type: web
    name: aryan-cloud
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aryan-cloud-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: aryan-cloud-data
      mountPath: /var/data
      sizeGB: 1

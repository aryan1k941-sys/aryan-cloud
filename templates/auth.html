{% extends "base.html" %}{% block body %}<div class="panel" style="max-width:480px;margin:auto"><h2>{{"Create account" if mode=="register" else "Welcome back"}}</h2><form method="post">{% if mode=="register" %}<label>Name</label><input name="name" required minlength="2">{% endif %}<label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" required minlength="8"><button>{{"Register" if mode=="register" else "Login"}}</button></form><p class="muted">{% if mode=="register" %}Already registered? <a href="/login">Login</a>{% else %}New here? <a href="/register">Create account</a>{% endif %}</p></div>{% endblock %}

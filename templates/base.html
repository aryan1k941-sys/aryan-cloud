<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ brand }}</title><style>
:root{--bg:#0b1020;--panel:#121a2e;--line:#273451;--txt:#edf2ff;--muted:#98a8c8;--accent:#8b7cff;--green:#40d6a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1c2450 0,transparent 35%),var(--bg);color:var(--txt);font:15px Inter,system-ui,Arial}a{color:#b9b1ff;text-decoration:none}.nav{display:flex;justify-content:space-between;align-items:center;padding:18px max(5vw,18px);border-bottom:1px solid var(--line);background:#0b1020dd;position:sticky;top:0}.logo{font-weight:900;font-size:22px}.logo span{color:var(--accent)}.wrap{max-width:1120px;margin:32px auto;padding:0 18px}.panel,.card{background:linear-gradient(145deg,#151f36,#10182a);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 50px #0003}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.muted{color:var(--muted)}h1{font-size:clamp(30px,5vw,48px);margin:10px 0}h2{margin-top:0}button,.btn{background:var(--accent);color:white;border:0;padding:11px 16px;border-radius:10px;font-weight:700;cursor:pointer;display:inline-block}input{width:100%;padding:12px;background:#0b1325;border:1px solid var(--line);border-radius:10px;color:white;margin:6px 0 14px}label{color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}.notice{padding:12px;border-radius:10px;background:#182b40;margin:10px 0}.error{background:#492332}.success{background:#173c35}.tag{padding:4px 8px;background:#252d50;border-radius:20px;font-size:12px}.price{font-size:32px;font-weight:900}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spacer{height:18px}@media(max-width:650px){table{font-size:12px}.wrap{margin:20px auto}.nav{padding:14px}}
</style></head><body><div class="nav"><a class="logo" href="/">☁ <span>Aryan</span> Cloud</a><div class="row">{% if me %}<a href="/dashboard">Dashboard</a>{% if me.is_admin %}<a href="/admin">Admin</a>{% endif %}<a href="/logout">Logout</a>{% else %}<a href="/login">Login</a><a class="btn" href="/register">Get Started</a>{% endif %}</div></div><main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{category}}">{{message}}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main></body></html>
